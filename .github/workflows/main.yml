name: Daily Numerology Refresh

on:
  schedule:
    - cron: '1 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Keep workflow alive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keepalive"
          git push

      - name: Install Pixlet
        env:
          PIXLET_VERSION: 0.34.0
        run: |
          curl -fL --retry 3 --retry-all-errors -o pixlet.tar.gz \
            "https://github.com/tidbyt/pixlet/releases/download/v${PIXLET_VERSION}/pixlet_${PIXLET_VERSION}_linux_amd64.tar.gz"
          tar -xzf pixlet.tar.gz
          chmod +x pixlet
          sudo mv pixlet /usr/local/bin/

      - name: Render numerology app
        run: pixlet render numerology.star

      - name: Push to Tidbyt
        run: |
          pixlet push --installation-id "numerology" \
            --api-token "${{ secrets.TIDBYT_API_TOKEN }}" \
            "${{ secrets.TIDBYT_DEVICE_ID }}" \
            numerology.webp
